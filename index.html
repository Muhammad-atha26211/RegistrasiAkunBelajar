<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun Belajar</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="registrasi-container">
     <h1>Registrasi Akun Belajar</h1>
     <p class="deskripsi">Lengkapi formulir di bawah ini dengan benar!</p>
      <form action="#" method="POST">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        <label for="email">Alamat Email</label>
        <input type="text" id="email" name="email" placeholder="nama@contoh.com" required>
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" required>
        <label for="confirm-password">Konfirmasi Kata Sandi</label>
        <input type="password" id="confirm-password : " name="confirm-password" placeholder="Ulangi kata sandi" required>
        <label for="status">Status Pengguna</label>
        <select id="status" name="status" required>
                <option value="">Pilih Status</option>
                <option value="pelajar">Pelajar</option>
                <option value="mahasiswa">Mahasiswa</option>
        </select>
        <button type="submit">Daftar</button>
      </form>
    </div>
  </body>
</html>
